services:
  - type: web
    name: tryonhub-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: tryonhub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        value: "https://tryonhub-api.onrender.com"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: tryonhub-db
    databaseName: tryonhub
    user: tryon_user
