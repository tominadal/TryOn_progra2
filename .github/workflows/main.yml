name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        working-directory: ./backend
        env:
          # Use SQLite in-memory for CI — avoids needing a real Postgres container
          DATABASE_URL: "sqlite:///:memory:"
          # Dummy secret key that satisfies the >= 32 chars validator
          SECRET_KEY: "ci-test-secret-key-do-not-use-in-production!!"
          GEMINI_API_KEY: "ci-dummy-key"
          BASE_URL: "http://localhost:8000"
        run: |
          python -m pytest --tb=short -v
